const MIN_SPEED=4,BASE_SPEED=14,MAX_SPEED=27,TURN_RATE=0.9,SHIP_PTS=[-11,0,10];
function moveShip(dt){ship.x+=-Math.sin(ship.h)*ship.speed*dt;ship.z+=-Math.cos(ship.h)*ship.speed*dt;}
function updateShip(dt){const target=[MIN_SPEED,BASE_SPEED,MAX_SPEED][throttleInput()+1];ship.speed=approach(ship.speed,target,(target>ship.speed?7:12)*dt);const turnTarget=steerInput()*TURN_RATE*(0.8+0.2*clamp(ship.speed/BASE_SPEED,0,1.5));ship.turn=lerp(ship.turn,turnTarget,1-Math.exp(-6*dt));ship.h+=ship.turn*dt;moveShip(dt);if(ship.inv>0)ship.inv-=dt;}
function bounceFrom(sx){let dx=-Math.sin(ship.h),dz=-Math.cos(ship.h);if(dx*sx>0)dx=-dx*0.5;ship.h=Math.atan2(-dx,-dz);ship.turn=0;}
function checkShore(){for(const lz of SHIP_PTS){const px=ship.x+lz*Math.sin(ship.h),pz=ship.z+lz*Math.cos(ship.h);if(pz>C.funnelStart){if(Math.abs(px)>C.oceanHalf||pz>100){if(Math.abs(px)>C.oceanHalf){ship.x-=Math.sign(px)*(Math.abs(px)-C.oceanHalf);bounceFrom(Math.sign(px));}if(pz>100){ship.z-=pz-100;ship.h=lerp(ship.h,Math.round(ship.h/(Math.PI*2))*Math.PI*2,0.2);}if(time-softWarn>4){softWarn=time;toast('Nobbys Lighthouse is that way — head for the harbour!');}return;}continue;}const lim=hw(pz)-3;if(Math.abs(px)>lim){const s=Math.sign(px);ship.x-=s*(Math.abs(px)-lim+0.6);bounceFrom(s);damage(pz>C.widenEnd?'Rocks!':'Wharf!');return;}if(pz<C.end+3){ship.z+=(C.end+3-pz)+0.6;ship.h+=Math.PI*0.5*(ship.x>0?1:-1);ship.turn=0;damage('Wharf!');return;}}}
function checkObstacles(){if(ship.inv>0)return;for(const o of obstacles){if(!o.active)continue;if((o.x-ship.x)**2+(o.z-ship.z)**2>1100)continue;for(const[ox,oz]of o.parts){const cx=o.x+ox,cz=o.z+oz;for(const lz of SHIP_PTS){const px=ship.x+lz*Math.sin(ship.h),pz=ship.z+lz*Math.cos(ship.h),dx=px-cx,dz=pz-cz,d=Math.hypot(dx,dz),minD=2.6+o.r;if(d<minD){const nx=dx/(d||1),nz=dz/(d||1);ship.x+=nx*(minD-d+0.4);ship.z+=nz*(minD-d+0.4);damage(o.kind==='ferry'?'Ferry!':o.kind==='yacht'?'Sorry mate!':'Bump!');if(o.breakable){o.active=false;o.obj.visible=false;for(let i=0;i<6;i++)spawnWake(cx+rand(-2,2),cz+rand(-2,2),1.4);}return;}}}}}
function checkGates(){for(const g of gates){if(g.passed)continue;if(prevZ>g.z&&ship.z<=g.z){g.passed=true;if(ship.x>g.x-GATE_GAP&&ship.x<g.x+GATE_GAP){gatesGot++;score+=50;Sound.gate();popup('+50',ship.x,9,ship.z-8,'green');}}}prevZ=ship.z;}
function checkStars(){const bx=ship.x-9*Math.sin(ship.h),bz=ship.z-9*Math.cos(ship.h);for(const s of stars){if(s.got)continue;if((s.x-ship.x)**2+(s.z-ship.z)**2<30||(s.x-bx)**2+(s.z-bz)**2<30){s.got=true;s.m.visible=false;starsGot++;score+=25;Sound.ding();popup('+25',s.x,5,s.z);}}}
function inBerth(){return Math.abs(ship.x-BERTH.x)<BERTH.w/2&&Math.abs(ship.z-BERTH.z)<BERTH.d/2;}
function checkDockAndHints(){const dist=Math.hypot(ship.x-BERTH.x,ship.z-BERTH.z),slowKey=isTouch?'Hold SLOW':'Hold ↓';if(inBerth()){if(ship.speed<=10){dock();return;}setHint(`Too fast! ${slowKey} to dock`,true);}else if(dist<150)setHint(`${slowKey} to ease into the green berth`);else setHint(null);if(!hints.channel&&ship.z<C.funnelEnd){hints.channel=1;toast('Through the breakwaters — steady as she goes');}if(!hints.ferry&&ship.z<-625){hints.ferry=1;toast('Watch out for the Stockton ferry!');}if(!hints.berth&&ship.z<-870){hints.berth=1;toast('Coal berth ahead on the right — follow the green light');}}

function updateShipVisual(dt){const t=time;const hb=waveH(ship.x-11*Math.sin(ship.h),ship.z-11*Math.cos(ship.h),t);const hs=waveH(ship.x+10*Math.sin(ship.h),ship.z+10*Math.cos(ship.h),t);const hm=waveH(ship.x,ship.z,t);shipRoot.position.set(ship.x,0,ship.z);shipRoot.rotation.y=ship.h;if(state==='WRECKING'||(state==='OVER'&&hull<=0)){const k=clamp(endTimer/1.8,0,1);shipInner.position.y=lerp(hm*0.8,-2.6,k);shipInner.rotation.z=lerp(shipInner.rotation.z,0.32,0.05);shipInner.rotation.x=lerp(shipInner.rotation.x,-0.12,0.05);}else{shipInner.position.y=(hb+hs+hm)/3*0.85+0.15;shipInner.rotation.x=Math.atan2(hb-hs,21)*0.8;shipInner.rotation.z=lerp(shipInner.rotation.z,ship.turn*0.28,0.1);}if(shipInner.userData.radar)shipInner.userData.radar.rotation.y=t*2.2;shipRoot.visible=!(ship.inv>0&&state==='PLAYING'&&Math.floor(ship.inv*10)%2===0);wakeTimer-=dt;if(wakeTimer<=0&&ship.speed>1&&state!=='OVER'){wakeTimer=0.045;for(const sx of[-2.4,2.4]){const lz=11.5,wx=ship.x+sx*Math.cos(ship.h)+lz*Math.sin(ship.h),wz=ship.z-sx*Math.sin(ship.h)+lz*Math.cos(ship.h);spawnWake(wx+rand(-0.4,0.4),wz+rand(-0.4,0.4),0.55+ship.speed/40);}if(ship.speed>9)for(const sx of[-2.6,2.6]){const lz=-9.5,wx=ship.x+sx*Math.cos(ship.h)+lz*Math.sin(ship.h),wz=ship.z-sx*Math.sin(ship.h)+lz*Math.cos(ship.h);spawnWake(wx,wz,0.45);}}}
function updateWorld(dt){const t=time;ferry.x=Math.sin(t*Math.PI*2/40)*92;const ta=t*0.22;tug.x=-50+Math.cos(ta)*22;tug.z=-930+Math.sin(ta)*22;tug.obj.rotation.y=Math.PI-ta;tug.parts=[[-Math.sin(tug.obj.rotation.y)*2.5,-Math.cos(tug.obj.rotation.y)*2.5],[Math.sin(tug.obj.rotation.y)*2.5,Math.cos(tug.obj.rotation.y)*2.5]];for(const o of obstacles){if(!o.obj.visible)continue;o.obj.position.set(o.x,waveH(o.x,o.z,t)*o.bob*0.9-(o.breakable?0.4:0),o.z);if(o.kind!=='tug'&&o.kind!=='ferry'){o.obj.rotation.z=Math.sin(t*1.3+o.phase)*0.08;o.obj.rotation.x=Math.cos(t*1.1+o.phase)*0.06;}}
  redLM.emissiveIntensity=(Math.sin(t*4)>0.3)?2:0.1;greenLM.emissiveIntensity=(Math.sin(t*4+1.6)>0.3)?2:0.1;for(const m of beaconLights)m.emissiveIntensity=(Math.sin(t*2.5)>0)?1.6:0.2;lampMat.emissiveIntensity=1.2+Math.sin(t*3)*0.5;for(const s of stars)if(!s.got){s.m.rotation.y=t*2+s.x;s.m.position.y=3.2+Math.sin(t*2.5+s.z)*0.5;}berthMat.opacity=0.22+Math.sin(t*3)*0.1;beaconMat.opacity=0.28+Math.sin(t*3)*0.1;if(flag){const p=flag.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setZ(i,Math.sin(x*1.6-t*6)*0.18*x/4);}p.needsUpdate=true;}for(const a of anchored)a.position.y=waveH(a.position.x,a.position.z,t)*0.4;for(const s of surf){const k=(t*0.25+s.k*0.5)%1;s.m.position.z=C.coast+6-k*8;s.m.material.opacity=Math.sin(k*Math.PI)*0.7;}
  for(const w of wakes){if(w.life<=0)continue;w.life-=dt/2.6;if(w.life<=0){w.m.visible=false;continue;}const sc=w.s*(1+(1-w.life)*2.4);w.m.scale.set(sc,1,sc);w.m.material.opacity=w.life*0.55;w.m.position.y=waveH(w.m.position.x,w.m.position.z,t)+0.3;}
  gullCenter.x=lerp(gullCenter.x,ship.x,1-Math.exp(-0.8*dt));gullCenter.z=lerp(gullCenter.z,ship.z-10,1-Math.exp(-0.8*dt));for(const gl of gulls){gl.a+=gl.w*dt;gl.g.position.set(gullCenter.x+Math.cos(gl.a)*gl.r,gl.y+Math.sin(t+gl.ph)*1.5,gullCenter.z+Math.sin(gl.a)*gl.r);gl.g.rotation.y=(gl.w>0?Math.PI:0)-gl.a;const fl=Math.sin(t*7+gl.ph)*0.5;gl.g.userData.wl.rotation.z=fl;gl.g.userData.wr.rotation.z=fl;}
  for(const d of dolphins){if(d.p<0){d.t-=dt;if(d.t<=0){d.p=0;d.g.visible=true;d.dir=rand(0,6.28);}continue;}d.p+=dt/1.5;if(d.p>=1){d.p=-1;d.g.visible=false;d.t=rand(3,8);continue;}const dist=(d.p-0.5)*12;d.g.position.set(d.x-Math.sin(d.dir)*dist,-1.6+Math.sin(d.p*Math.PI)*4.6,d.z-Math.cos(d.dir)*dist);d.g.rotation.set(Math.cos(d.p*Math.PI)*0.9,d.dir,0);}}
const camLook=new THREE.Vector3(0,2,C.startZ-20),NOBBYS2=new THREE.Vector3(-78,28,-379);
function updateCamera(dt){const portrait=camera.aspect<0.9;if(state==='TITLE'){const a=time*0.05+0.6,R=170;camera.position.set(-40+Math.cos(a)*R,58,-380+Math.sin(a)*R);camLook.copy(NOBBYS2);camera.lookAt(camLook);if(camera.aspect>1.3)camera.rotateY(0.45);else if(camera.aspect<0.9)camera.rotateX(-0.2);return;}if(state==='OVER'){const a=time*0.1;camera.position.lerp(tmpV.set(ship.x+Math.cos(a)*75,38,ship.z+Math.sin(a)*75),1-Math.exp(-2*dt));camLook.lerp(tmpV.set(ship.x,2,ship.z),1-Math.exp(-3*dt));camera.lookAt(camLook);return;}const back=portrait?54:40,up=portrait?40:24;const tx=ship.x+Math.sin(ship.h)*back,tz=ship.z+Math.cos(ship.h)*back;const k=1-Math.exp(-3*dt);camera.position.x=lerp(camera.position.x,tx,k);camera.position.y=lerp(camera.position.y,up,k);camera.position.z=lerp(camera.position.z,tz,k);camLook.lerp(tmpV.set(ship.x-Math.sin(ship.h)*30,0,ship.z-Math.cos(ship.h)*30),1-Math.exp(-5*dt));camera.lookAt(camLook);if(shake>0){shake=Math.max(0,shake-dt*2.2);camera.position.x+=rand(-1,1)*shake*1.2;camera.position.y+=rand(-1,1)*shake*0.8;}}
function updateHUD(){$('score').textContent=score.toLocaleString();$('timer').textContent=elapsed.toFixed(1)+'s';const dist=Math.hypot(ship.x-BERTH.x,ship.z-BERTH.z);$('dist').textContent=`${Math.max(0,Math.round(dist))} m to the coal berth`;$('barfill').style.width=(clamp(1-dist/TOTAL_DIST,0,1)*100).toFixed(1)+'%';}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<0.9?72:60;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',onResize);onResize();
let lastT=performance.now();camera.position.set(0,60,200);
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-lastT)/1000,0.05);lastT=now;time+=dt;if(state==='PLAYING'){elapsed+=dt;updateShip(dt);checkShore();checkObstacles();if(state==='PLAYING'){checkGates();checkStars();checkDockAndHints();}updateHUD();}else if(state==='DOCKING'||state==='WRECKING'){ship.speed=Math.max(0,ship.speed-(state==='DOCKING'?7:10)*dt);ship.turn*=0.95;moveShip(dt);endTimer+=dt;if(endTimer>(state==='DOCKING'?2.2:2.0))showOver(state==='DOCKING');}else if(state==='OVER'){endTimer+=dt;}
  updateShipVisual(dt);updateWorld(dt);updateCamera(dt);const fx=state==='TITLE'?-40:ship.x,fz=state==='TITLE'?-380:ship.z;updateWater(time,fx,fz);
  if(state==='TITLE')placeSun(-60,-390);else placeSun(ship.x-Math.sin(ship.h)*50,ship.z-Math.cos(ship.h)*50);
  sky.position.copy(camera.position);Sound.setEngine(state==='PLAYING'?0.12+ship.speed/MAX_SPEED*0.18:state==='DOCKING'?0.06:0,ship.speed/MAX_SPEED);
  gullTimer-=dt;if(gullTimer<=0){gullTimer=rand(7,15);if(state!=='TITLE')Sound.gull();}renderer.render(scene,camera);}
requestAnimationFrame(frame);window.__hp={get state(){return state;},ship,startGame,get score(){return score;}};
</script>
