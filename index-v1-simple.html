<script type="module">
import * as THREE from 'three';
window.__hpLoaded = true;

// ================= helpers =================
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const approach = (v,t,d) => v < t ? Math.min(v+d, t) : Math.max(v-d, t);
const rand = (a,b) => a + Math.random()*(b-a);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const srand = mulberry32(2300);            // Newcastle's postcode — same world every time
const sr = (a,b) => a + srand()*(b-a);
const pick = arr => arr[Math.floor(srand()*arr.length)];
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

const matCache = new Map();
function mat(color, opts){
  const key = color + (opts ? JSON.stringify(opts) : '');
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial(Object.assign({ color, flatShading:true }, opts||{})));
  return matCache.get(key);
}
let scene; // assigned below; standalone pieces get added straight to the world
function mesh(geo, color, x=0, y=0, z=0, parent=null, opts){
  const m = new THREE.Mesh(geo, color instanceof THREE.Material ? color : mat(color, opts));
  m.position.set(x,y,z); (parent || scene).add(m); return m;
}
const box  = (w,h,d,c,x,y,z,p) => mesh(new THREE.BoxGeometry(w,h,d), c, x,y,z,p);
const cyl  = (rt,rb,h,c,seg,x,y,z,p) => mesh(new THREE.CylinderGeometry(rt,rb,h,seg||8), c, x,y,z,p);
const cone = (r,h,c,seg,x,y,z,p) => mesh(new THREE.ConeGeometry(r,h,seg||8), c, x,y,z,p);

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
$('loading').remove();

scene = new THREE.Scene();
const FOG = 0xcfe8f6;
scene.fog = new THREE.Fog(FOG, 300, 1150);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.5, 4000);

scene.add(new THREE.HemisphereLight(0xe3f3ff, 0x5d7f4a, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d2, 2.3);
sun.position.set(-160, 260, 140);
scene.add(sun);

// sky dome
{
  const R = 2400, g = new THREE.SphereGeometry(R, 24, 16), p = g.attributes.position, cols = [];
  const top = new THREE.Color(0x3a86d4), hor = new THREE.Color(0xd6edf9), c = new THREE.Color();
  for (let i=0;i<p.count;i++){ const t = Math.pow(Math.max(0, p.getY(i)/R), 0.55); c.copy(hor).lerp(top, t); cols.push(c.r,c.g,c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  var sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false }));
  sky.renderOrder = -1; scene.add(sky);
}

// ================= course layout =================
// Player heads "north-west" along -Z. Left (-X) = south side (Nobbys, the city). Right (+X) = Stockton & the coal loaders.
const C = { oceanHalf:150, funnelStart:-260, funnelEnd:-370, channelHalf:42, channelEnd:-580, harbourHalf:115, widenEnd:-660, end:-1120, startZ:40 };
function hw(z){
  if (z > C.funnelStart) return C.oceanHalf;
  if (z > C.funnelEnd)  return lerp(C.oceanHalf, C.channelHalf, (C.funnelStart - z)/(C.funnelStart - C.funnelEnd));
  if (z > C.channelEnd) return C.channelHalf;
  if (z > C.widenEnd)   return lerp(C.channelHalf, C.harbourHalf, (C.channelEnd - z)/(C.channelEnd - C.widenEnd));
  return C.harbourHalf;
}
const BERTH = { x:88, z:-1060, w:40, d:56 };
const TOTAL_DIST = Math.hypot(BERTH.x, BERTH.z - C.startZ);

// ================= water =================
const WAVE_SIZE = 1000, WAVE_SEG = 100, STEP = WAVE_SIZE/WAVE_SEG;
function waveAmp(z){ return z > -300 ? 1 : z > -620 ? lerp(1, 0.35, (-300 - z)/320) : 0.35; }
function waveH(x, z, t){
  return waveAmp(z) * (0.55*Math.sin(x*0.06 + t*1.1) + 0.45*Math.sin(z*0.08 - t*1.4) + 0.25*Math.sin((x+z)*0.13 + t*2.1));
}
const waterMat = new THREE.MeshPhongMaterial({ color:0x2a8bd0, specular:0x9ad6ff, shininess:45, flatShading:true });
const waterGeo = new THREE.PlaneGeometry(WAVE_SIZE, WAVE_SIZE, WAVE_SEG, WAVE_SEG);
waterGeo.rotateX(-Math.PI/2);
const waterBase = waterGeo.attributes.position.array.slice();
const waterFade = new Float32Array(waterGeo.attributes.position.count);
for (let i=0;i<waterFade.length;i++){ const r = Math.hypot(waterBase[i*3], waterBase[i*3+2]); waterFade[i] = 1 - THREE.MathUtils.smoothstep(r, 330, 450); }
const water = new THREE.Mesh(waterGeo, waterMat); scene.add(water);
const farGeo = new THREE.RingGeometry(460, 6000, 48, 1); farGeo.rotateX(-Math.PI/2);
const farWater = new THREE.Mesh(farGeo, waterMat); farWater.position.y = -0.03; scene.add(farWater);
function updateWater(t, cx, cz){
  const ox = Math.round(cx/STEP)*STEP, oz = Math.round(cz/STEP)*STEP;
  water.position.set(ox, 0, oz); farWater.position.x = ox; farWater.position.z = oz;
  const p = waterGeo.attributes.position.array;
  for (let i=0, j=0; i<p.length; i+=3, j++){
    const f = waterFade[j];
    p[i+1] = f > 0 ? f * waveH(waterBase[i]+ox, waterBase[i+2]+oz, t) : 0;
  }
  waterGeo.attributes.position.needsUpdate = true;
}

// ================= static world (instanced for speed) =================
const unitBox = new THREE.BoxGeometry(1,1,1); unitBox.translate(0,0.5,0);
const roofGeo = new THREE.ConeGeometry(0.75, 1, 4); roofGeo.rotateY(Math.PI/4); roofGeo.translate(0,0.5,0);
const icoGeo  = new THREE.IcosahedronGeometry(1, 0);
function instanced(geo, list){
  const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ flatShading:true }), list.length);
  const d = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((b,i) => {
    d.position.set(b.x, b.y, b.z); d.rotation.set(b.rx||0, b.ry||0, b.rz||0); d.scale.set(b.sx, b.sy, b.sz); d.updateMatrix();
    im.setMatrixAt(i, d.matrix); im.setColorAt(i, c.set(b.color));
  });
  im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.frustumCulled = false; scene.add(im); return im;
}
const boxes = [], roofs = [], rocks = [], trees = [];
const addBox = (x,y,z,sx,sy,sz,color,ry=0) => boxes.push({x,y,z,sx,sy,sz,color,ry});
const LAND_TOP = 2.2;
const GRASS_L = 0x8fbd5e, GRASS_R = 0x96c264;

// land beside the channel and harbour
for (let z = -365; z > C.end; z -= 5){
  const h = hw(z - 2.5);
  addBox(-(h+2+300), -2, z-2.5, 600, 4.2, 5.4, GRASS_L);
  addBox( (h+2+300), -2, z-2.5, 600, 4.2, 5.4, GRASS_R);
}
addBox(0, -2, C.end - 300, 1700, 4.2, 600, GRASS_L);                // land behind the harbour
// concrete wharves inside the harbour
addBox(-(C.harbourHalf+3), -2, (C.widenEnd + C.end)/2, 6, 4.6, C.widenEnd - C.end, 0xbab4a8);
addBox( (C.harbourHalf+3), -2, (C.widenEnd + C.end)/2, 6, 4.6, C.widenEnd - C.end, 0xbab4a8);
addBox(0, -2, C.end - 3, 2*C.harbourHalf + 12, 4.6, 6, 0xbab4a8);

// rock breakwaters (follow the exact collision line)
const ROCK_COLS = [0x8d8a84, 0x7a7771, 0xa19d95, 0x6f6c66, 0x948e84];
for (const s of [-1, 1]){
  const pts = [[150,-262],[42,-370],[42,-580],[115,-660]];
  for (let i=0;i<pts.length-1;i++){
    const [x0,z0] = pts[i], [x1,z1] = pts[i+1], L = Math.hypot(x1-x0, z1-z0), n = Math.ceil(L/2.4);
    for (let k=0;k<n;k++){
      const t = k/n, x = lerp(x0,x1,t), z = lerp(z0,z1,t);
      for (const row of [0,1]){
        const sc = row ? sr(1.8,2.8) : sr(2,3.4), off = 1.6 + row*3.4 + sr(-0.5,0.5);
        rocks.push({ x:s*(x+off), y:row ? 0.6 : 0.2, z:z+sr(-0.8,0.8), sx:sc, sy:sc*sr(0.6,0.9), sz:sc, rx:sr(0,3), ry:sr(0,3), rz:sr(0,3), color:pick(ROCK_COLS) });
      }
    }
  }
}

// ---- Nobbys Head & lighthouse ----
const lampMat = new THREE.MeshLambertMaterial({ color:0xfff2a8, emissive:0xffd54a, emissiveIntensity:1 });
{
  const g = new THREE.Group(); g.position.set(-84, 0, -380); scene.add(g);
  cyl(30, 35, 6, 0x9a8f7e, 11, 0, 1, 0, g);
  cyl(22, 30, 12, 0xc0ae8d, 11, 0, 9, 0, g);
  cyl(21.5, 22, 1.4, 0x7db354, 11, 0, 15.6, 0, g);
  const L = new THREE.Group(); L.position.set(6, 16.3, 3); g.add(L);
  cyl(1.4, 2.1, 10, 0xffffff, 12, 0, 5, 0, L);
  cyl(2.5, 2.5, 0.5, 0x2f2f2f, 12, 0, 10.2, 0, L);
  mesh(new THREE.CylinderGeometry(1.3, 1.3, 2, 12), lampMat, 0, 11.4, 0, L);
  cone(1.7, 1.8, 0xc62828, 12, 0, 13.3, 0, L);
  for (const [x,z,r] of [[-8,-5,0.2],[-6,7,1.4],[-12,2,0.9]]){
    const c = box(5, 3, 7, 0xfafafa, x, 17.8, z, g); c.rotation.y = r;
    const rf = mesh(roofGeo, 0xc0392b, x, 19.3, z, g); rf.scale.set(5.6, 2.2, 7.6); rf.rotation.y = r + Math.PI/4;
  }
}
// harbour entrance beacons — red on the left (port), green on the right (starboard)
const beaconLights = [];
for (const [x, col] of [[-150, 0xd32f2f],[150, 0x2e9d48]]){
  cyl(1.4, 1.8, 8, col, 8, x + Math.sign(x)*3, 5, -262);
  const lm = new THREE.MeshLambertMaterial({ color:col, emissive:col, emissiveIntensity:0.6 });
  beaconLights.push(lm);
  mesh(new THREE.SphereGeometry(1.2, 8, 6), lm, x + Math.sign(x)*3, 9.8, -262);
}

// ---- Fort Scratchley ----
function flagTexture(){
  const c = document.createElement('canvas'); c.width = 96; c.height = 48; const x = c.getContext('2d');

    this.engOsc = ctx.createOscillator(); this.engOsc.type = 'sawtooth'; this.engOsc.frequency.value = 42;
    const of = ctx.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 140;
    const og = ctx.createGain(); og.gain.value = 0.12;
    this.engOsc.connect(of).connect(og).connect(this.engGain); this.engOsc.start();
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = nb.getChannelData(0);
    for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    this.noiseBuf = nb;
  },
  setEngine(level, sp){
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.engGain.gain.setTargetAtTime(level, t, 0.25);
    this.engFilter.frequency.setTargetAtTime(150 + sp*380, t, 0.25);
    this.engOsc.frequency.setTargetAtTime(36 + sp*30, t, 0.25);
  },
  tone(freq, dur, type='sine', vol=0.2, when=0, slideTo=null, lp=null){
    if (!this.ctx) return; const ctx = this.ctx, t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o.connect(g);
    if (lp){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node = g.connect(f); f.connect(this.master); } else g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, lp){
    if (!this.ctx) return; const ctx = this.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + dur);
  },
  ding(){ this.tone(1046, 0.14, 'sine', 0.18); this.tone(1568, 0.3, 'sine', 0.14, 0.07); },
  gate(){ this.tone(660, 0.12, 'triangle', 0.16); this.tone(990, 0.18, 'triangle', 0.14, 0.08); },
  clunk(){ this.noise(0.35, 0.6, 380); this.tone(140, 0.4, 'sine', 0.45, 0, 38); },
  horn(){ this.tone(98, 1.5, 'sawtooth', 0.16, 0, null, 500); this.tone(147, 1.5, 'sawtooth', 0.1, 0, null, 500); },
  chime(){ [523, 659, 784, 1047, 1319].forEach((f,i) => this.tone(f, 0.6, 'triangle', 0.16, 0.25 + i*0.11)); },
  wreck(){ this.noise(1.2, 0.5, 250); this.tone(180, 1.4, 'sawtooth', 0.12, 0, 45, 600); [392, 330, 262].forEach((f,i) => this.tone(f, 0.45, 'triangle', 0.13, 0.5 + i*0.3)); },
  gull(){ for (let k=0;k<3;k++) this.tone(rand(1600,1900), 0.17, 'sine', 0.035, k*0.21, 1050); },
  setMuted(m){ this.muted = m; store.set('hp_muted', m ? '1' : '0'); if (this.master) this.master.gain.value = m ? 0 : 0.8; }
};

const best = () => parseInt(store.get('hp_newcastle_best') || '0', 10) || 0;
function showTitleBest(){ const b = best(); $('bestTitle').textContent = b ? `Your best: ${b.toLocaleString()} points` : 'Can you dock without a scratch?'; }
showTitleBest();
$('title').classList.add('show');

function resetRun(){
  Object.assign(ship, { x:0, z:C.startZ, h:0, speed:14, turn:0, inv:0 });
  shipRoot.visible = true; shipInner.rotation.set(0,0,0); shipInner.position.set(0,0,0);
  elapsed = 0; score = 0; hull = 3; starsGot = 0; gatesGot = 0; hints = {}; shake = 0;
  for (const o of obstacles) if (o.breakable){ o.active = true; o.obj.visible = true; }
  for (const s of stars){ s.got = false; s.m.visible = true; }
  for (const g of gates) g.passed = false;
  for (const w of wakes){ w.life = 0; w.m.visible = false; }
  updateHullUI();
}
function startGame(){
  Sound.init();
  resetRun();
  state = 'PLAYING';
  $('title').classList.remove('show'); $('over').classList.remove('show');
  document.body.classList.add('playing');
  Sound.horn();
  toast('Welcome to Newcastle! Steer for Nobbys Lighthouse');
  setTimeout(() => { if (state === 'PLAYING' && !hints.gates) { hints.gates = 1; toast('Go between the red & green markers for bonus points'); } }, 3600);
}

function damage(label){
  if (ship.inv > 0) return;
  hull--; ship.inv = 1.8; ship.speed = Math.min(ship.speed, 6); shake = 1;
  updateHullUI(); Sound.clunk();
  const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  popup(label || 'Bump!', ship.x, 8, ship.z, 'red');
  if (navigator.vibrate) try { navigator.vibrate(120); } catch(_){}
  if (hull <= 0) wreck();
}
function wreck(){
  state = 'WRECKING'; endTimer = 0; Sound.wreck(); setHint(null);
  lastTotal = score;
}
function dock(){
  state = 'DOCKING'; endTimer = 0; setHint(null);
  Sound.horn(); Sound.chime(); confetti();
  const timeBonus = Math.max(0, Math.round((120 - elapsed) * 10));
  const hullBonus = hull * 150, gentle = ship.speed <= 6 ? 100 : 0;
  lastTotal = score + 500 + timeBonus + hullBonus + gentle;
  dock.breakdown = { timeBonus, hullBonus, gentle };
  toast('Docked! Nice work, pilot ⚓', 2000);
}
function showOver(docked){
  state = 'OVER';
  document.body.classList.remove('playing');
  const prev = best(), isBest = lastTotal > prev && lastTotal > 0;
  if (isBest) store.set('hp_newcastle_best', String(lastTotal));
  const b = dock.breakdown || {};
  const rows = docked
    ? `<div><span>Stars collected (${starsGot}/${stars.length})</span><b>${starsGot*25}</b></div>
       <div><span>Marker gates (${gatesGot}/${gates.length})</span><b>${gatesGot*50}</b></div>
       <div><span>Safely docked</span><b>500</b></div>
       <div><span>Time bonus (${elapsed.toFixed(1)}s)</span><b>${b.timeBonus}</b></div>
       <div><span>Hull bonus (${hull}/3)</span><b>${b.hullBonus}</b></div>
       ${b.gentle ? '<div><span>Gentle docking</span><b>100</b></div>' : ''}

    : `<div><span>Stars collected (${starsGot}/${stars.length})</span><b>${starsGot*25}</b></div>
       <div><span>Marker gates (${gatesGot}/${gates.length})</span><b>${gatesGot*50}</b></div>
       <div class="total"><span>Score</span><span>${lastTotal.toLocaleString()}</span></div>`;
  $('overCard').innerHTML = `
    ${isBest ? '<div class="newbest">★ New best!</div>' : ''}
    <div class="kicker">${docked ? 'Newcastle Harbour' : 'Uh oh…'}</div>
    <h2>${docked ? 'Docked! ⚓' : 'Run aground!'}</h2>
    ${docked ? '' : '<p class="sub">Your ship took one bump too many. Shake it off and try again.</p>'}
    <div class="rows">${rows}</div>
    <div class="btnrow"><button class="btn" id="again">Play again</button><button class="btn ghost" id="share">Challenge a mate</button></div>
    <div class="best">Best: ${Math.max(prev, lastTotal).toLocaleString()} · ${isTouch ? '' : 'Press Space to play again'}</div>`;
  $('over').classList.add('show');
  $('again').onclick = () => startGame();
  $('share').onclick = async () => {
    const text = `I scored ${lastTotal.toLocaleString()} piloting a coal ship into Newcastle Harbour ⚓ Can you beat it?`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    try {
      if (navigator.share) await navigator.share({ title:'Harbour Pilot — Newcastle', text, url: url || undefined });
      else { await navigator.clipboard.writeText(url ? `${text} ${url}` : text); toast('Copied — paste it anywhere!'); }
    } catch(_){}

}

// ================= simulation =================
const MIN_SPEED = 4, BASE_SPEED = 14, MAX_SPEED = 27, TURN_RATE = 0.9;
const SHIP_PTS = [-11, 0, 10];
function moveShip(dt){
  ship.x += -Math.sin(ship.h) * ship.speed * dt;
  ship.z += -Math.cos(ship.h) * ship.speed * dt;
}
function updateShip(dt){
  const target = [MIN_SPEED, BASE_SPEED, MAX_SPEED][throttleInput() + 1];
  ship.speed = approach(ship.speed, target, (target > ship.speed ? 7 : 12) * dt);
  const turnTarget = steerInput() * TURN_RATE * (0.8 + 0.2*clamp(ship.speed/BASE_SPEED, 0, 1.5));
  ship.turn = lerp(ship.turn, turnTarget, 1 - Math.exp(-6*dt));
  ship.h += ship.turn * dt;
  moveShip(dt);
  if (ship.inv > 0) ship.inv -= dt;
}
function bounceFrom(sx){ // push heading away from a side wall (sx = +1 right wall, -1 left wall)
  let dx = -Math.sin(ship.h), dz = -Math.cos(ship.h);
  if (dx * sx > 0) dx = -dx * 0.5;
  ship.h = Math.atan2(-dx, -dz); ship.turn = 0;
}
function checkShore(){
  for (const lz of SHIP_PTS){
    const px = ship.x + lz*Math.sin(ship.h), pz = ship.z + lz*Math.cos(ship.h);
    if (pz > C.funnelStart){ // open ocean: gentle invisible boundary, no damage
      if (Math.abs(px) > C.oceanHalf || pz > 100){
        if (Math.abs(px) > C.oceanHalf){ ship.x -= Math.sign(px) * (Math.abs(px) - C.oceanHalf); bounceFrom(Math.sign(px)); }
        if (pz > 100){ ship.z -= pz - 100; ship.h = lerp(ship.h, Math.round(ship.h/(Math.PI*2))*Math.PI*2, 0.2); }
        if (time - softWarn > 4){ softWarn = time; toast('Nobbys Lighthouse is that way — head for the harbour!'); }
        return;
      }
      continue;
    }
    const lim = hw(pz) - 3;
    if (Math.abs(px) > lim){ const s = Math.sign(px); ship.x -= s * (Math.abs(px) - lim + 0.6); bounceFrom(s); damage(pz > C.widenEnd ? 'Rocks!' : 'Wharf!'); return; }
    if (pz < C.end + 3){ ship.z += (C.end + 3 - pz) + 0.6; ship.h += Math.PI*0.5*(ship.x > 0 ? 1 : -1); ship.turn = 0; damage('Wharf!'); return; }
  }
}
function checkObstacles(){
  if (ship.inv > 0) return;            // ghost mode while blinking after a bump — never get dragged into repeat hits
  for (const o of obstacles){
    if (!o.active) continue;
    if ((o.x-ship.x)**2 + (o.z-ship.z)**2 > 1100) continue;
    for (const [ox, oz] of o.parts){
      const cx = o.x + ox, cz = o.z + oz;
      for (const lz of SHIP_PTS){
        const px = ship.x + lz*Math.sin(ship.h), pz = ship.z + lz*Math.cos(ship.h);
        const dx = px - cx, dz = pz - cz, d = Math.hypot(dx, dz), minD = 2.6 + o.r;
        if (d < minD){
          const nx = dx/(d||1), nz = dz/(d||1);
          ship.x += nx*(minD - d + 0.4); ship.z += nz*(minD - d + 0.4);
          damage(o.kind === 'ferry' ? 'Ferry!' : o.kind === 'yacht' ? 'Sorry mate!' : 'Bump!');
          if (o.breakable){ o.active = false; o.obj.visible = false; for (let i=0;i<6;i++) spawnWake(cx + rand(-2,2), cz + rand(-2,2), 1.4); }
          return;
        }
      }
    }
  }
}
let prevZ = C.startZ;
function checkGates(){
  for (const g of gates){
    if (g.passed) continue;
    if (prevZ > g.z && ship.z <= g.z){
      g.passed = true;
      if (ship.x > g.x - GATE_GAP && ship.x < g.x + GATE_GAP){ gatesGot++; score += 50; Sound.gate(); popup('+50', ship.x, 9, ship.z - 8, 'green'); }
    }
  }
  prevZ = ship.z;
}
function checkStars(){
  const bx = ship.x - 9*Math.sin(ship.h), bz = ship.z - 9*Math.cos(ship.h);
  for (const s of stars){
    if (s.got) continue;
    if ((s.x-ship.x)**2 + (s.z-ship.z)**2 < 30 || (s.x-bx)**2 + (s.z-bz)**2 < 30){
      s.got = true; s.m.visible = false; starsGot++; score += 25; Sound.ding(); popup('+25', s.x, 5, s.z);
    }
  }
}
function inBerth(){ return Math.abs(ship.x - BERTH.x) < BERTH.w/2 && Math.abs(ship.z - BERTH.z) < BERTH.d/2; }
function checkDockAndHints(){
  const dist = Math.hypot(ship.x - BERTH.x, ship.z - BERTH.z);
  const slowKey = isTouch ? 'Hold SLOW' : 'Hold ↓';
  if (inBerth()){
    if (ship.speed <= 10){ dock(); return; }
    setHint(`Too fast! ${slowKey} to dock`, true);
  } else if (dist < 150) setHint(`${slowKey} to ease into the green berth`);
  else setHint(null);
  if (!hints.channel && ship.z < C.funnelEnd){ hints.channel = 1; toast('Through the breakwaters — steady as she goes'); }
  if (!hints.ferry && ship.z < -625){ hints.ferry = 1; toast('Watch out for the Stockton ferry!'); }
  if (!hints.berth && ship.z < -870){ hints.berth = 1; toast('Coal berth ahead on the right — follow the green light'); }
}

// ================= visuals per frame =================
function updateShipVisual(dt){
  const t = time;
  const hb = waveH(ship.x - 11*Math.sin(ship.h), ship.z - 11*Math.cos(ship.h), t);
  const hs = waveH(ship.x + 10*Math.sin(ship.h), ship.z + 10*Math.cos(ship.h), t);
  const hm = waveH(ship.x, ship.z, t);
  shipRoot.position.set(ship.x, 0, ship.z);
  shipRoot.rotation.y = ship.h;
  if (state === 'WRECKING' || (state === 'OVER' && hull <= 0)){
    const k = clamp(endTimer / 1.8, 0, 1);
    shipInner.position.y = lerp(hm*0.8, -2.6, k);
    shipInner.rotation.z = lerp(shipInner.rotation.z, 0.32, 0.05);
    shipInner.rotation.x = lerp(shipInner.rotation.x, -0.12, 0.05);
  } else {
    shipInner.position.y = (hb + hs + hm)/3 * 0.85 + 0.15;
    shipInner.rotation.x = Math.atan2(hb - hs, 21) * 0.8;
    shipInner.rotation.z = lerp(shipInner.rotation.z, ship.turn * 0.28, 0.1);
  }
  shipRoot.visible = !(ship.inv > 0 && state === 'PLAYING' && Math.floor(ship.inv*10) % 2 === 0);
  // wake
  wakeTimer -= dt;
  if (wakeTimer <= 0 && ship.speed > 1 && state !== 'OVER'){
    wakeTimer = 0.05;
    for (const sx of [-2.2, 2.2]){
      const lx = sx, lz = 11.5;
      const wx = ship.x + lx*Math.cos(ship.h) + lz*Math.sin(ship.h);
      const wz = ship.z - lx*Math.sin(ship.h) + lz*Math.cos(ship.h);
      spawnWake(wx + rand(-0.4,0.4), wz + rand(-0.4,0.4), 0.35 + ship.speed/45);
    }
  }
}
function updateWorld(dt){
  const t = time;
  // ferry shuttles across the harbour
  const fx = Math.sin(t * Math.PI*2 / 40) * 92;
  ferry.x = fx;
  // tug putters in a loop
  const ta = t * 0.22;
  tug.x = -50 + Math.cos(ta)*22; tug.z = -930 + Math.sin(ta)*22;
  tug.obj.rotation.y = Math.PI - ta;
  tug.parts = [[ -Math.sin(tug.obj.rotation.y)*2.5, -Math.cos(tug.obj.rotation.y)*2.5 ], [ Math.sin(tug.obj.rotation.y)*2.5, Math.cos(tug.obj.rotation.y)*2.5 ]];
  for (const o of obstacles){
    if (!o.obj.visible) continue;
    o.obj.position.set(o.x, waveH(o.x, o.z, t) * o.bob * 0.9 - (o.breakable ? 0.4 : 0), o.z);
    if (o.kind !== 'tug' && o.kind !== 'ferry'){ o.obj.rotation.z = Math.sin(t*1.3 + o.phase)*0.08; o.obj.rotation.x = Math.cos(t*1.1 + o.phase)*0.06; }
  }
  const blink = (Math.sin(t*4) > 0.3) ? 1.2 : 0.15;
  redLight.emissiveIntensity = blink; greenLight.emissiveIntensity = (Math.sin(t*4 + 1.6) > 0.3) ? 1.2 : 0.15;
  for (const m of beaconLights) m.emissiveIntensity = (Math.sin(t*2.5) > 0) ? 1 : 0.2;
  lampMat.emissiveIntensity = 0.7 + Math.sin(t*3)*0.3;
  for (const s of stars) if (!s.got){ s.m.rotation.y = t*2 + s.x; s.m.position.y = 3.2 + Math.sin(t*2.5 + s.z)*0.5; }
  berthMat.opacity = 0.22 + Math.sin(t*3)*0.1;
  beaconMat.opacity = 0.28 + Math.sin(t*3)*0.1;
  if (flag) flag.rotation.y = Math.sin(t*2.2)*0.25;
  for (const a of anchored) a.position.y = waveH(a.position.x, a.position.z, t)*0.4;
  // wake particles
  for (const w of wakes){
    if (w.life <= 0) continue;
    w.life -= dt/2.4;
    if (w.life <= 0){ w.m.visible = false; continue; }
    const sc = w.s * (1 + (1 - w.life)*2.2);
    w.m.scale.set(sc, 1, sc); w.m.material.opacity = w.life*0.38;
    w.m.position.y = waveH(w.m.position.x, w.m.position.z, t) + 0.3;
  }
  // gulls circle the ship
  gullCenter.x = lerp(gullCenter.x, ship.x, 1 - Math.exp(-0.8*dt)); gullCenter.z = lerp(gullCenter.z, ship.z - 10, 1 - Math.exp(-0.8*dt));
  for (const gl of gulls){
    gl.a += gl.w * dt;
    gl.g.position.set(gullCenter.x + Math.cos(gl.a)*gl.r, gl.y + Math.sin(t + gl.ph)*1.5, gullCenter.z + Math.sin(gl.a)*gl.r);
    gl.g.rotation.y = (gl.w > 0 ? Math.PI : 0) - gl.a;
    const fl = Math.sin(t*7 + gl.ph)*0.55; gl.g.userData.wl.rotation.z = fl; gl.g.userData.wr.rotation.z = fl;
  }
  // dolphins leap now and then
  for (const d of dolphins){
    if (d.p < 0){ d.t -= dt; if (d.t <= 0){ d.p = 0; d.g.visible = true; d.dir = rand(0, 6.28); } continue; }
    d.p += dt/1.5;
    if (d.p >= 1){ d.p = -1; d.g.visible = false; d.t = rand(3, 8); continue; }
    const dist = (d.p - 0.5) * 12;
    d.g.position.set(d.x - Math.sin(d.dir)*dist, -1.6 + Math.sin(d.p*Math.PI)*4.6, d.z - Math.cos(d.dir)*dist);
    d.g.rotation.set(Math.cos(d.p*Math.PI)*0.9, d.dir, 0);
  }
}

// camera
const camLook = new THREE.Vector3(0, 2, C.startZ - 20);
const NOBBYS = new THREE.Vector3(-78, 26, -377);
function updateCamera(dt){
  const portrait = camera.aspect < 0.9;
  if (state === 'TITLE'){
    const a = time * 0.05 + 0.6, R = 170;
    camera.position.set(-40 + Math.cos(a)*R, 58, -380 + Math.sin(a)*R);
    camLook.copy(NOBBYS); camera.lookAt(camLook);
    if (camera.aspect > 1.3) camera.rotateY(0.45);   // keep Nobbys to the right of the title card
    else if (camera.aspect < 0.9) camera.rotateX(-0.2); // phones: lift Nobbys above the card
    return;
  }
  if (state === 'OVER'){
    const a = time * 0.1;
    camera.position.lerp(tmpV.set(ship.x + Math.cos(a)*75, 38, ship.z + Math.sin(a)*75), 1 - Math.exp(-2*dt));
    camLook.lerp(tmpV.set(ship.x, 2, ship.z), 1 - Math.exp(-3*dt)); camera.lookAt(camLook); return;
  }
  const back = portrait ? 54 : 40, up = portrait ? 40 : 24;
  const tx = ship.x + Math.sin(ship.h)*back, tz = ship.z + Math.cos(ship.h)*back;
  const k = 1 - Math.exp(-3*dt);
  camera.position.x = lerp(camera.position.x, tx, k);
  camera.position.y = lerp(camera.position.y, up, k);
  camera.position.z = lerp(camera.position.z, tz, k);
  camLook.lerp(tmpV.set(ship.x - Math.sin(ship.h)*30, 0, ship.z - Math.cos(ship.h)*30), 1 - Math.exp(-5*dt));
  camera.lookAt(camLook);
  if (shake > 0){ shake = Math.max(0, shake - dt*2.2); camera.position.x += rand(-1,1)*shake*1.2; camera.position.y += rand(-1,1)*shake*0.8; }
}

function updateHUD(){
  $('score').textContent = score.toLocaleString();
  $('timer').textContent = elapsed.toFixed(1) + 's';
  const dist = Math.hypot(ship.x - BERTH.x, ship.z - BERTH.z);
  $('dist').textContent = `${Math.max(0, Math.round(dist))} m to the coal berth`;
  $('barfill').style.width = (clamp(1 - dist/TOTAL_DIST, 0, 1)*100).toFixed(1) + '%';
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.fov = camera.aspect < 0.9 ? 72 : 60;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();

// ================= main loop =================
let lastT = performance.now();
camera.position.set(0, 60, 200);
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT)/1000, 0.05); lastT = now; time += dt;
  if (state === 'PLAYING'){
    elapsed += dt;
    updateShip(dt); checkShore(); checkObstacles();
    if (state === 'PLAYING'){ checkGates(); checkStars(); checkDockAndHints(); }
    updateHUD();
  } else if (state === 'DOCKING' || state === 'WRECKING'){
    ship.speed = Math.max(0, ship.speed - (state === 'DOCKING' ? 7 : 10)*dt);
    ship.turn *= 0.95; moveShip(dt); endTimer += dt;
    if (endTimer > (state === 'DOCKING' ? 2.2 : 2.0)) showOver(state === 'DOCKING');
  } else if (state === 'OVER'){ endTimer += dt; }
  updateShipVisual(dt);
  updateWorld(dt);
  updateCamera(dt);
  const focusX = state === 'TITLE' ? -40 : ship.x, focusZ = state === 'TITLE' ? -380 : ship.z;
  updateWater(time, focusX, focusZ);
  sky.position.copy(camera.position);
  Sound.setEngine(state === 'PLAYING' ? 0.12 + ship.speed/MAX_SPEED*0.18 : state === 'DOCKING' ? 0.06 : 0, ship.speed/MAX_SPEED);
  gullTimer -= dt; if (gullTimer <= 0){ gullTimer = rand(7, 15); if (state !== 'TITLE') Sound.gull(); }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__hp = { get state(){ return state; }, ship, startGame, get score(){ return score; } }; // for testing
</script>
